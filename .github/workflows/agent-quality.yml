name: agent-quality

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "contracts/**"
      - "compose.yaml"
      - ".dockerignore"
      - "Taskfile.yml"
      - ".github/workflows/agent-quality.yml"
  pull_request:
    paths:
      - "agent/**"
      - "contracts/**"
      - "compose.yaml"
      - ".dockerignore"
      - "Taskfile.yml"
      - ".github/workflows/agent-quality.yml"
  workflow_dispatch:
    inputs:
      accepted_base:
        description: Accepted pre-change contract commit SHA
        required: true
        type: string
      cutover_base:
        description: Optional explicitly approved one-time cutover baseline SHA
        required: false
        type: string
      cutover_head:
        description: Optional explicitly approved one-time cutover HEAD SHA
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: agent-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-agent-qa:
    name: Secret-free Agent static QA
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12.13"
      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa
        with:
          version: "3.49.1"
      - name: Install pinned uv bootstrap
        run: python -m pip install --disable-pip-version-check uv==0.11.28
      - name: Lint contracts and enforce accepted-base compatibility
        env:
          SCYG_CONTRACTS_ACCEPTED_BASE: ${{ github.event.pull_request.base.sha || github.event.before || inputs.accepted_base }}
          SCYG_CONTRACTS_CUTOVER_BASE: ${{ inputs.cutover_base || vars.CONTRACTS_CUTOVER_BASE }}
          SCYG_CONTRACTS_CUTOVER_HEAD: ${{ inputs.cutover_head || vars.CONTRACTS_CUTOVER_HEAD }}
        run: task contracts:check
      - name: Run static-safe Agent QA only
        run: task qa:agent:static
