version: '3'

vars:
  BINARY: api
  MODULE: github.com/PengYuee/SCYG.Blog/backend
  GO_VERSION: 1.26.8
  GO_IMAGE: golang:1.26.8-bookworm@sha256:dc9ad6c05acc7a88e5b71bde60a5fe3bd4b9f0db209011711b464107438a8107
  POSTGRES_IMAGE: postgres:17.5@sha256:aadf2c0696f5ef357aa7a68da995137f0cf17bad0bf6e1f17de06ae5c769b302
  TASK_VERSION: v3.49.1
  GOFUMPT_CMD: go run mvdan.cc/gofumpt@v0.10.0
  GOIMPORTS_CMD: go run golang.org/x/tools/cmd/goimports@v0.48.0
  GOLANGCI_LINT_CMD: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
  NILAWAY_CMD: go run go.uber.org/nilaway/cmd/nilaway@v0.0.0-20260710181136-2378218750e4
  GOVULNCHECK_CMD: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0
  OPENAPI_LINT_CMD: go run github.com/daveshanley/vacuum@v0.29.0
  OAPI_CODEGEN_CMD: go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.7.2
  MIGRATE_CMD: go run github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.0
  IMAGE: scyg-blog-backend:ci
  PLAN_PATH: '{{default "../.omo/plans/go-service-architecture-foundation.md" .PLAN_PATH}}'
  EVIDENCE_ROOT: '{{default "../.omo/evidence" .EVIDENCE_ROOT}}'

tasks:
  default:
    desc: Run the current backend quality gate
    cmds:
      - task: ci

  task:version:check:
    desc: Require the pinned Task runner version
    cmds:
      - cmd: >-
          powershell.exe -NoProfile -Command
          "if ((& '{{.TASK_EXE}}' --version).Trim() -ne '{{trimPrefix "v" .TASK_VERSION}}') { Write-Error '必须使用 Task {{.TASK_VERSION}}'; exit 1 }"
        platforms: [windows]
      - cmd: >-
          sh -c 'test "$("{{.TASK_EXE}}" --version)" = "{{trimPrefix "v" .TASK_VERSION}}"'
        platforms: [linux, darwin]

  format:
    desc: Format all Go source files
    deps: [proto:generate]
    cmds:
      - '{{.GOFUMPT_CMD}} -w .'
      - '{{.GOIMPORTS_CMD}} -w -local {{.MODULE}} .'

  fmt:check:
    desc: Reject Go formatting drift without modifying files
    deps: [proto:generate]
    cmds:
      - cmd: >-
          powershell.exe -NoProfile -Command
          "\$files = @({{.GOFUMPT_CMD}} -l .); if (\$files.Count -gt 0) { \$files | ForEach-Object { Write-Output \$_ }; exit 1 }"
        platforms: [windows]
      - cmd: >-
          sh -c 'files="$({{.GOFUMPT_CMD}} -l .)"; if [ -n "\$files" ]; then printf "%s\n" "\$files"; exit 1; fi'
        platforms: [linux, darwin]

  lint:
    desc: Run pinned static analyzers outside the runtime module graph
    deps: [proto:generate]
    cmds:
      - '{{.GOLANGCI_LINT_CMD}} run ./...'
      - '{{.NILAWAY_CMD}} -include-pkgs={{.MODULE}}/... ./...'

  unit:
    desc: Run uncached race-enabled unit tests
    deps: [proto:generate]
    cmds:
      - go test -race -shuffle=on -count=1 ./...

  integration:
    desc: Run integration-tagged tests with explicit QA configuration
    deps: [proto:generate]
    cmds:
      - cmd: >-
          sh -c 'test -n "$QA_CONFIG" || { echo "QA_CONFIG is required" >&2; exit 1; }; if [ -n "$PACKAGES" ]; then go test -tags=integration -race -shuffle=on -count=1 $PACKAGES; else go test -tags=integration -race -shuffle=on -count=1 ./...; fi'
        platforms: [linux, darwin]
        env:
          QA_CONFIG: '{{.QA_CONFIG}}'
          PACKAGES: '{{.PACKAGES}}'
      - cmd: >-
          powershell.exe -NoProfile -Command "if ([string]::IsNullOrWhiteSpace('{{.QA_CONFIG}}')) { Write-Error 'QA_CONFIG is required'; exit 1 }; Set-Item -Path Env:QA_CONFIG -Value (Resolve-Path -LiteralPath '{{.QA_CONFIG}}' -ErrorAction Stop).Path; if ([string]::IsNullOrWhiteSpace('{{.PACKAGES}}')) { go test -tags=integration -race -shuffle=on -count=1 ./... } else { go test -tags=integration -race -shuffle=on -count=1 {{.PACKAGES}} }"
        platforms: [windows]
        env:
          QA_CONFIG: '{{.QA_CONFIG}}'
          PACKAGES: '{{.PACKAGES}}'

  e2e:
    desc: Run end-to-end-tagged tests with explicit QA configuration
    deps: [proto:generate]
    cmds:
      - cmd: >-
          sh -c 'test -n "$QA_CONFIG" || { echo "QA_CONFIG is required" >&2; exit 1; }; if [ -n "$PACKAGES" ]; then go test -tags=e2e -race -shuffle=on -count=1 $PACKAGES; else go test -tags=e2e -race -shuffle=on -count=1 ./...; fi'
        platforms: [linux, darwin]
        env:
          QA_CONFIG: '{{.QA_CONFIG}}'
          PACKAGES: '{{.PACKAGES}}'
      - cmd: >-
          powershell.exe -NoProfile -Command "if ([string]::IsNullOrWhiteSpace('{{.QA_CONFIG}}')) { Write-Error 'QA_CONFIG is required'; exit 1 }; Set-Item -Path Env:QA_CONFIG -Value (Resolve-Path -LiteralPath '{{.QA_CONFIG}}' -ErrorAction Stop).Path; if ([string]::IsNullOrWhiteSpace('{{.PACKAGES}}')) { go test -tags=e2e -race -shuffle=on -count=1 ./... } else { go test -tags=e2e -race -shuffle=on -count=1 {{.PACKAGES}} }"
        platforms: [windows]
        env:
          QA_CONFIG: '{{.QA_CONFIG}}'
          PACKAGES: '{{.PACKAGES}}'

  generate:
    desc: Regenerate all committed source artifacts
    cmds:
      - task: api:generate
      - task: proto:generate

  build:
    desc: Build the API binary
    deps: [proto:generate]
    cmds:
      - go build -trimpath -o bin/{{.BINARY}}{{exeExt}} ./cmd/api

  vet:
    desc: Run Go vet
    deps: [proto:generate]
    cmds:
      - go vet ./...

  mod:verify:
    desc: Verify downloaded module content
    cmds:
      - go mod verify

  vuln:
    desc: Scan packages with pinned govulncheck
    deps: [proto:generate]
    cmds:
      - '{{.GOVULNCHECK_CMD}} ./...'

  api:lint:
    desc: Lint the authoritative OpenAPI contract
    cmds:
      - '{{.OPENAPI_LINT_CMD}} lint api/openapi.yaml'

  api:generate:
    desc: Generate OpenAPI Gin interfaces and transport models
    cmds:
      - '{{.OAPI_CODEGEN_CMD}} --config oapi-codegen.yaml api/openapi.yaml'
      - '{{.OAPI_CODEGEN_CMD}} --config oapi-codegen-spec.yaml api/openapi.yaml'

  api:docs:sync:
    desc: Synchronize the API docs copy from the authoritative specification
    cmds:
      - go run ./internal/docsync

  api:docs:check:
    desc: Reject API documentation specification drift
    cmds:
      - go run ./internal/docsync --check

  api:generate:check:
    desc: Reject OpenAPI generation drift without modifying committed output
    cmds:
      - cmd: go build -trimpath -o bin/generationcheck.exe ./internal/generationcheck
        platforms: [windows]
      - cmd: bin/generationcheck.exe
        platforms: [windows]
      - cmd: go run ./internal/generationcheck
        platforms: [linux, darwin]

  migrate:version:
    desc: Print the pinned migration CLI version
    cmds:
      - '{{.MIGRATE_CMD}} -version'

  tools:versions:
    desc: Print pinned tool versions
    cmds:
      - go version
      - task --version
      - '{{.GOFUMPT_CMD}} -version'
      - '{{.GOLANGCI_LINT_CMD}} version'
      - '{{.NILAWAY_CMD}} -V'
      - '{{.GOVULNCHECK_CMD}} -version'
      - '{{.OPENAPI_LINT_CMD}} version'
      - '{{.OAPI_CODEGEN_CMD}} -version'

  generate:freshness:
    desc: Regenerate committed artifacts and reject Git drift
    cmds:
      - task: generate
      - task: api:docs:sync
      - git diff --exit-code -- .

  migrate:up:
    desc: 使用显式配置应用全部内嵌迁移
    cmds:
      - cmd: test -n "$CONFIG" || { echo "CONFIG is required" >&2; exit 1; }; go run ./cmd/migrate -config "$CONFIG" up
        platforms: [linux, darwin]
        env:
          CONFIG: '{{.CONFIG}}'
      - cmd: powershell.exe -NoProfile -Command "if ([string]::IsNullOrWhiteSpace('{{.CONFIG}}')) { Write-Error 'CONFIG is required'; exit 1 }; go run ./cmd/migrate -config '{{.CONFIG}}' up"
        platforms: [windows]
        env:
          CONFIG: '{{.CONFIG}}'

  migrate:down:
    desc: 使用显式配置回滚全部内嵌迁移
    cmds:
      - cmd: test -n "$CONFIG" || { echo "CONFIG is required" >&2; exit 1; }; go run ./cmd/migrate -config "$CONFIG" down
        platforms: [linux, darwin]
        env:
          CONFIG: '{{.CONFIG}}'
      - cmd: powershell.exe -NoProfile -Command "if ([string]::IsNullOrWhiteSpace('{{.CONFIG}}')) { Write-Error 'CONFIG is required'; exit 1 }; go run ./cmd/migrate -config '{{.CONFIG}}' down"
        platforms: [windows]
        env:
          CONFIG: '{{.CONFIG}}'


  container:build:
    desc: Build the pinned API image
    cmds:
      - docker build --pull=false --tag {{.IMAGE}} -f Dockerfile ..

  compose:smoke:
    desc: Start Compose and wait for PostgreSQL and API healthchecks
    cmds:
      - docker compose up --detach --wait --wait-timeout 120
      - cmd: >-
          powershell.exe -NoProfile -Command "Invoke-WebRequest -UseBasicParsing http://127.0.0.1:${SCYG_API_PORT:-8080}/live | Out-Null; Invoke-WebRequest -UseBasicParsing http://127.0.0.1:${SCYG_API_PORT:-8080}/ready | Out-Null"
        platforms: [windows]
      - cmd: >-
          sh -c 'curl --fail --silent --show-error http://127.0.0.1:${SCYG_API_PORT:-8080}/live >/dev/null && curl --fail --silent --show-error http://127.0.0.1:${SCYG_API_PORT:-8080}/ready >/dev/null'
        platforms: [linux, darwin]

  compose:down:
    desc: Stop Compose and remove its anonymous resources
    cmds:
      - docker compose down --remove-orphans

  qa:feature:
    desc: Run fast feature-level backend checks
    deps: [proto:generate]
    cmds:
      - task: task:version:check
      - task: fmt:check
      - task: mod:verify
      - go test ./internal/architecture ./internal/reviewtest -count=1

  qa:contract:
    desc: Run API contract checks
    deps: [proto:generate]
    cmds:
      - task: api:lint
      - task: api:generate:check
      - task: api:docs:check
      - go test ./internal/contracttest -count=1

  reconcile:content:
    desc: Run the bounded read-only content reconciliation command
    cmds:
      - go run ./cmd/content-reconcile -config "{{.RECONCILE_CONFIG}}" -quiesce-evidence "{{.QUIESCE_EVIDENCE}}" -evidence-root "{{.EVIDENCE_ROOT}}" -release "{{.RELEASE}}" -phase "{{.PHASE}}" {{if .PREVIOUS_ATTEMPT}}-previous-attempt "{{.PREVIOUS_ATTEMPT}}"{{end}}

  reconcile:fixture:
    desc: Run the reconciliation fixture smoke through the QA orchestrator
    cmds:
      - cmd: powershell.exe -NoProfile -Command "if ([string]::IsNullOrWhiteSpace('{{.QA_CONFIG}}')) { Write-Error 'QA_CONFIG is required'; exit 1 }; go run ./cmd/content-reconcile-fixture -config '{{.QA_CONFIG}}'"
        platforms: [windows]
        env:
          QA_CONFIG: '{{.QA_CONFIG}}'
      - cmd: sh -c 'test -n "$QA_CONFIG" || { echo "QA_CONFIG is required" >&2; exit 1; }; go run ./cmd/content-reconcile-fixture -config "$QA_CONFIG"'
        platforms: [linux, darwin]
        env:
          QA_CONFIG: '{{.QA_CONFIG}}'

  qa:static:
    desc: Run the bounded backend quality and delivery configuration gates
    cmds:
      - task: qa:feature
      - task: qa:contract
      - go test ./internal/deliverytest -count=1
      - task: vet
      - task: lint
      - task: unit
      - task: build
      - task: vuln

  qa:database:
    desc: Run the fixed QA database orchestrator
    deps: [proto:generate]
    cmds:
      - cmd: test -n "$QA_CONFIG" || { echo "QA_CONFIG is required" >&2; exit 1; }; go run ./cmd/qa-database -config "$QA_CONFIG"
        platforms: [linux, darwin]
        env:
          QA_CONFIG: '{{.QA_CONFIG}}'
      - cmd: powershell.exe -NoProfile -Command "if ([string]::IsNullOrWhiteSpace('{{.QA_CONFIG}}')) { Write-Error 'QA_CONFIG is required'; exit 1 }; go run ./cmd/qa-database -config '{{.QA_CONFIG}}'"
        platforms: [windows]
        env:
          QA_CONFIG: '{{.QA_CONFIG}}'

  qa:container:
    desc: Run image build and Compose health smoke gates
    cmds:
      - task: container:build
      - task: compose:smoke
      - defer: task compose:down

  ci:
    desc: Run the local backend quality gate shared with CI
    cmds:
      - task: qa:static
  qa:plan:
    desc: Audit plan, evidence, history-facing handoff surfaces and final targets
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/qa-plan.ps1

  qa:quality:
    desc: Run the shared bounded static backend gate
    cmds:
      - task: qa:static

  qa:scope:
    desc: Reject excluded runtime scope while allowing future design documentation
    cmds:
      - go test -timeout 30s ./internal/reviewtest -run 'Test_Scope' -count=1

  qa:foundation:
    desc: Run real PostgreSQL, API, Compose, fault, restart and shutdown narratives
    cmds:
      - task: qa:database
      - task: qa:container

  proto:generate:
    desc: Generate ignored internal protobuf bindings before consuming Go packages
    run: once
    cmds:
      - npx --yes @bufbuild/buf@1.47.2 generate ../contracts --template ../contracts/buf.gen.go.yaml --output internal/generated/proto
