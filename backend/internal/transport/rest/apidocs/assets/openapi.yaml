openapi: 3.0.3
info:
  title: SCYG Blog Content API
  version: 1.0.0
  description: "SCYG 博客内容 API，提供公开读取和受授权保护的写入。"
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: Articles
    description: "文章读取与维护。"
  - name: ArticleTypes
    description: "文章类型查询与维护。"
  - name: Tags
    description: "标签查询与维护。"
  - name: ArticleImages
    description: "文章正文图片上传、取消与媒体读取。"
  - name: Auth
    description: "身份认证。"
  - name: Agent
    description: "JWT 保护的 Agent Run 创建、查询、交互、取消和 SSE 订阅。"
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Auth]
      security: []
      summary: "登录并获取访问令牌"
      description: "使用用户名和密码验证用户身份，成功后返回短期 Bearer JWT。"
      requestBody:
        description: "用户登录凭据。"
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: "登录成功。"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/articles:
    get:
      operationId: listArticles
      security: []
      tags: [Articles]
      summary: "查询已发布文章"
      description: "分页返回状态为 `2`（已发布）且未删除的文章，可按文章类型、标签和关键词筛选。"
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/ArticleTypeFilter'
        - $ref: '#/components/parameters/TagFilter'
        - $ref: '#/components/parameters/SearchFilter'
      responses:
        '200':
          description: "请求成功，返回当前资源或分页响应。"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/articles/{articleId}:
    parameters:
      - $ref: '#/components/parameters/ArticleID'
    get:
      operationId: getArticle
      security: []
      tags: [Articles]
      summary: "获取已发布文章"
      description: "仅在文章状态为 `2`（已发布）且未删除时返回。"
      responses:
        '200':
          description: "请求成功，返回当前资源或分页响应。"
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/manage/articles:
    get:
      operationId: listManageArticles
      tags: [Articles]
      summary: "管理端查询文章"
      description: "受保护地分页返回所有未删除文章，包括草稿、已发布和已归档文章。"
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/ArticleTypeFilter'
        - $ref: '#/components/parameters/TagFilter'
        - $ref: '#/components/parameters/SearchFilter'
      responses:
        '200':
          description: "管理端文章分页。"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createManageArticle
      tags: [Articles]
      summary: "管理端创建文章"
      description: "受保护地创建文章并返回资源、规范地址和强实体标签。"
      requestBody:
        description: "创建文章所需的 JSON 数据。"
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleCreate'
            example: {title: 示例文章, slug: sample-article, digest: 示例摘要, content: 示例正文, articleTypeId: 1, tagIds: [1], status: 1}
      responses:
        '201':
          description: "创建成功，返回当前资源、`Location` 和 `ETag`。"
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/manage/articles/{articleId}:
    parameters:
      - $ref: '#/components/parameters/ArticleID'
    get:
      operationId: getManageArticle
      tags: [Articles]
      summary: "管理端获取文章"
      description: "受保护地获取未删除文章，包括草稿、已发布和已归档文章。"
      responses:
        '200':
          description: "管理端文章详情。"
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: patchManageArticle
      tags: [Articles]
      summary: "管理端部分更新文章"
      description: "受保护地更新文章字段；生命周期迁移使用独立动作接口。`If-Match` 必须与当前版本一致。"
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        description: "管理端文章局部更新字段；不包含生命周期状态。"
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticlePatch'
      responses:
        '200':
          description: "更新成功。"
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteManageArticle
      tags: [Articles]
      summary: "管理端删除文章"
      description: "受保护地软删除文章；`If-Match` 必须与当前版本一致。"
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: "删除成功。"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/manage/articles/{articleId}/publish:
    post:
      operationId: publishManageArticle
      tags: [Articles]
      summary: "管理端发布文章"
      description: "受保护地将草稿发布；`If-Match` 必须与当前版本一致。"
      parameters:
        - $ref: '#/components/parameters/ArticleID'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: "发布成功。"
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/manage/articles/{articleId}/archive:
    post:
      operationId: archiveManageArticle
      tags: [Articles]
      summary: "管理端归档文章"
      description: "受保护地将已发布文章归档；`If-Match` 必须与当前版本一致。"
      parameters:
        - $ref: '#/components/parameters/ArticleID'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: "归档成功。"
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/article-types:
    get:
      operationId: listPublicArticleTypes
      security: []
      tags: [ArticleTypes]
      summary: "查询公开文章类型"
      description: "分页返回有公开文章的未删除文章类型，按公开文章数量降序、标识升序返回。"
      parameters:
        - $ref: '#/components/parameters/PublicPage'
        - $ref: '#/components/parameters/PublicPageSize'
        - $ref: '#/components/parameters/PublicSearchFilter'
      responses:
        '200':
          description: "请求成功。"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicArticleTypeList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/article-types/{articleTypeId}:
    parameters:
      - $ref: '#/components/parameters/ArticleTypeID'
    get:
      operationId: getPublicArticleType
      security: []
      tags: [ArticleTypes]
      summary: "获取公开文章类型"
      description: "返回有公开文章的未删除文章类型。"
      responses:
        '200':
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          description: "请求成功。"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicArticleType'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/tags:
    get:
      operationId: listPublicTags
      security: []
      tags: [Tags]
      summary: "查询公开标签"
      description: "分页返回关联公开文章的未删除标签，按公开文章数量降序、标识升序返回。"
      parameters:
        - $ref: '#/components/parameters/PublicPage'
        - $ref: '#/components/parameters/PublicPageSize'
        - $ref: '#/components/parameters/PublicSearchFilter'
      responses:
        '200':
          description: "请求成功。"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTagList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/tags/{tagId}:
    parameters:
      - $ref: '#/components/parameters/TagID'
    get:
      operationId: getPublicTag
      security: []
      tags: [Tags]
      summary: "获取公开标签"
      description: "返回关联公开文章的未删除标签。"
      responses:
        '200':
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          description: "请求成功。"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTag'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/manage/article-types:
    get:
      operationId: listManageArticleTypes
      tags: [ArticleTypes]
      summary: "管理端查询文章类型"
      description: "受保护地分页返回所有未删除文章类型，包括没有公开文章的项目。"
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/SearchFilter'
      responses:
        '200':
          description: "请求成功。"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleTypeList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createManageArticleType
      tags: [ArticleTypes]
      summary: "管理端创建文章类型"
      description: "受保护地创建文章类型并返回资源、规范地址和强实体标签。"
      requestBody:
        description: "创建文章类型所需的 JSON 数据。"
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleTypeCreate'
      responses:
        '201':
          description: "创建成功。"
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/manage/article-types/{articleTypeId}:
    parameters:
      - $ref: '#/components/parameters/ArticleTypeID'
    get:
      operationId: getManageArticleType
      tags: [ArticleTypes]
      summary: "管理端获取文章类型"
      description: "受保护地按标识获取未删除文章类型，包括没有公开文章的项目。"
      responses:
        '200':
          description: "请求成功。"
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: patchManageArticleType
      tags: [ArticleTypes]
      summary: "管理端更新文章类型"
      description: "受保护地更新文章类型；`If-Match` 必须与当前版本一致。"
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        description: "更新文章类型所需的 JSON 数据。"
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleTypePatch'
      responses:
        '200':
          description: "更新成功。"
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteManageArticleType
      tags: [ArticleTypes]
      summary: "管理端删除文章类型"
      description: "受保护地删除未被引用的文章类型；`If-Match` 必须与当前版本一致。"
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: "删除成功，不返回响应体。"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/manage/tags:
    get:
      operationId: listManageTags
      tags: [Tags]
      summary: "管理端查询标签"
      description: "受保护地分页返回所有未删除标签，包括没有公开文章的项目。"
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/SearchFilter'
      responses:
        '200':
          description: "请求成功。"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createManageTag
      tags: [Tags]
      summary: "管理端创建标签"
      description: "受保护地创建标签并返回资源、规范地址和强实体标签。"
      requestBody:
        description: "创建标签所需的 JSON 数据。"
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCreate'
      responses:
        '201':
          description: "创建成功。"
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/manage/tags/{tagId}:
    parameters:
      - $ref: '#/components/parameters/TagID'
    get:
      operationId: getManageTag
      tags: [Tags]
      summary: "管理端获取标签"
      description: "受保护地按标识获取未删除标签，包括没有公开文章的项目。"
      responses:
        '200':
          description: "请求成功。"
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: patchManageTag
      tags: [Tags]
      summary: "管理端更新标签"
      description: "受保护地更新标签；`If-Match` 必须与当前版本一致。"
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        description: "更新标签所需的 JSON 数据。"
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagPatch'
      responses:
        '200':
          description: "更新成功。"
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteManageTag
      tags: [Tags]
      summary: "管理端删除标签"
      description: "受保护地删除未被引用的标签；`If-Match` 必须与当前版本一致。"
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: "删除成功，不返回响应体。"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/manage/article-images:
    post:
      operationId: createManageArticleImage
      tags: [ArticleImages]
      summary: "管理端上传正文图片"
