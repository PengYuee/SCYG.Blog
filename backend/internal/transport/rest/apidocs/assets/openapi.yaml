      summary: "取消 Run"
      description: "使用 Blog Bearer JWT，请求不得包含 body。Agent 设置取消栅栏后立即返回 cancelled，不再发起新的 Tool 调用；在途 Blog 写入可以完成且结果保留，但不再将 Run 推进为成功。已 cancelled 的 Run 使用新 key 再取消返回当前 Run；已 succeeded 或 failed 的 Run 返回 409。Run 不存在和非 owner 均返回 404。Agent 集成关闭时返回 404。"
