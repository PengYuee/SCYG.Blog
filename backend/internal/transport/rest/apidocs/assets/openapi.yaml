          type: string
          minLength: 1
        tokenType:
          description: "令牌类型：`Bearer` 表示 HTTP Bearer 认证。"
          type: string
          enum: [Bearer]
        expiresAt:
          description: "令牌过期时间。"
          type: string
          format: date-time
    ArticleImageID:
      description: "正文图片标识，固定为 32 位小写十六进制字符串。"
      type: string
      minLength: 32
      maxLength: 32
      pattern: '^[0-9a-f]{32}$'
      example: 0123456789abcdef0123456789abcdef
    ArticleImageStorageKey:
