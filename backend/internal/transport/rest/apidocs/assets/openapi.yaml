        default:
          $ref: '#/components/responses/AgentError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AgentRunID:
      description: "Agent 生成的不透明 URL-safe ASCII 标识，长度 1–128；只允许 A–Z、a–z、0–9、点、下划线、波浪号、连字符，不能等于 . 或 ..。"
      name: runId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AgentRunID'
    AgentIdempotencyKey:
      description: "必填 UUID v4。每个新的逻辑操作生成新 key，仅重试同一操作沿用原 key，不得跨 capability、RPC、Run 或 interaction 复用。Create、Resume、Cancel 共用 user_id + key 作用域；仅成功操作持久化，自成功提交起保留 24 小时。有效期内重试返回绑定 Run 的当前状态，不重复执行，也不比较请求摘要或操作类型；重放仍校验 owner。到期后可能作为新请求处理，仍受交互和终态约束。"
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
    AgentEventCursor:
      description: "可选的不透明事件游标；提供时必须为 1–256 个 ASCII 字节。Blog 不解析、不比较、不持久化，作为 after_event_id 原样传给 Agent；省略时由 Agent 使用默认订阅位置。"
      name: Last-Event-ID
      in: header
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: '^[\x00-\x7F]+$'
    ArticleImageID:
      description: "32 位小写十六进制正文图片标识。"
      name: imageId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ArticleImageID'
    ArticleImageStorageKey:
      description: "32 位小写十六进制正文图片键及 `.jpg` 或 `.png` 扩展名。"
      name: storageKey
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ArticleImageStorageKey'
    ArticleID:
      description: "文章正整数标识。"
      name: articleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PositiveID'
    ArticleTypeID:
      description: "文章类型正整数标识。"
      name: articleTypeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PositiveID'
    TagID:
      description: "标签正整数标识。"
      name: tagId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PositiveID'
    IfMatch:
      description: "强实体标签，内容为当前正整数版本，必须原样提交，例如 `\"1\"`。"
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
        example: '"1"'
    Page:
      description: "从 `1` 开始的页码，默认 `1`。"
      name: page
      in: query
      schema:
        type: integer
        format: int32
        default: 1
        minimum: 1
    PageSize:
      description: "每页数量，默认 `20`，范围 `1` 至 `100`。"
      name: pageSize
      in: query
      schema:
        type: integer
        format: int32
        default: 20
        minimum: 1
        maximum: 100
    PublicPage:
      description: "从 `1` 开始的必填页码。"
      name: page
      in: query
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
    PublicPageSize:
      description: "必填的每页数量，范围 `1` 至 `100`。"
      name: pageSize
      in: query
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
    PublicSearchFilter:
      description: "按名称筛选；服务端先去除首尾空白，再进行不区分大小写的包含匹配。"
      name: q
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 200
        example: Go
    Sort:
      description: "排序：`createdAt` 创建时间升序，`-createdAt` 降序，`updatedAt` 更新时间升序，`-updatedAt` 降序，`title` 标题升序，`-title` 降序。"
      name: sort
      in: query
      schema:
        description: "`createdAt` 创建时间升序，`-createdAt` 创建时间降序，`updatedAt` 更新时间升序，`-updatedAt` 更新时间降序，`title` 标题升序，`-title` 标题降序。"
        type: string
        default: -createdAt
        enum: [createdAt, -createdAt, updatedAt, -updatedAt, title, -title]
        example: -createdAt
    ArticleTypeFilter:
      description: "按文章类型标识筛选文章，例如 `1`。"
      name: articleTypeId
      in: query
      schema:
        $ref: '#/components/schemas/PositiveID'
    TagFilter:
      description: "按标签标识筛选文章，例如 `1`。"
      name: tagId
      in: query
      schema:
        $ref: '#/components/schemas/PositiveID'
    SearchFilter:
      description: "按关键词筛选可搜索文本，例如 `Go`。"
      name: q
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 200
        example: Go
  headers:
    ETag:
      description: "强实体标签，内容为当前正整数版本，例如 `\"1\"`。"
      required: true
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
        example: '"1"'
    Location:
      description: "新资源规范 URI，例如 `/api/v1/manage/articles/1`。"
      required: true
      schema:
        type: string
        format: uri-reference
  responses:
    AgentError:
      description: "RFC 9457 错误响应。HTTP 400：非法 ID、key、JSON 或请求结构，或 Agent INVALID_ARGUMENT；401：JWT 无效或 UNAUTHENTICATED；404：集成关闭、NOT_FOUND 或 PERMISSION_DENIED（含非 owner）；409：ALREADY_EXISTS、ABORTED 或 FAILED_PRECONDITION；413：body 超过 1 MiB；415：创建或 Resume 的 Content-Type 缺失或不是 application/json；429：RESOURCE_EXHAUSTED；503：UNAVAILABLE 或 DEADLINE_EXCEEDED；其他 Agent 错误为 500。建立 SSE 之前同样适用，提交 200 后仅关闭流。Agent 提供的公开 code、message 已脱敏，缺失时使用本地通用消息；不透传 Provider 原始错误、数据库信息、密钥或敏感 Tool 参数。"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: "HTTP `400`，请求参数或请求体校验失败。"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: "HTTP `401`，缺少或无法验证认证凭据。"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: "HTTP `403`，写操作授权被拒绝。"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: "HTTP `404`，资源不存在或不可公开访问。"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: "HTTP `409`，唯一性或业务前置条件冲突。"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: "HTTP `412`，`If-Match` 已过期，与当前版本不一致。"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: "HTTP `428`，缺少 `If-Match` 请求头。"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: "HTTP `500`，服务发生未处理错误。"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    AgentRunID:
      description: "Agent 生成的不透明 URL-safe ASCII Run 标识，长度 1–128，不能等于 . 或 ..。"
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9._~-]+$'
      not:
        enum: ['.', '..']
    AgentRun:
      description: "Create、Get、Resume、Cancel 共用的 owner 授权 Run 快照，字段始终存在；无结果、失败或待处理交互时对应值为 null。result 与 failure 可以同时存在，Blog 不实现 Run 状态机。"
      type: object
      required: [runId, status, capability, recipeId, recipeVersion, createdAt, updatedAt, failure, result, pendingInteraction, streamUrl]
      properties:
        runId:
          $ref: '#/components/schemas/AgentRunID'
        status:
          description: "Run 状态：`queued` 排队，`running` 执行中，`waitingForApproval` 等待交互，`succeeded` 成功，`failed` 失败，`cancelled` 已取消；后三者为终态。"
          type: string
          enum: [queued, running, waitingForApproval, succeeded, failed, cancelled]
        capability:
          description: "路由固定能力：`search` 搜索，`write` 写作，`polish` 润色，`chat` 对话。"
          type: string
          enum: [search, write, polish, chat]
        recipeId:
          description: "Agent 选定的 Recipe 标识，创建成功起非空，客户端只读。"
          type: string
          minLength: 1
          readOnly: true
        recipeVersion:
          description: "Agent 选定的 Recipe 版本，创建成功起非空，客户端只读。"
          type: string
          minLength: 1
          readOnly: true
        createdAt:
          description: "Run 创建时间，RFC 3339 UTC 字符串。"
          type: string
          format: date-time
          pattern: 'Z$'
        updatedAt:
          description: "Run 最近更新时间，RFC 3339 UTC 字符串。"
          type: string
          format: date-time
          pattern: 'Z$'
        streamUrl:
          description: "Blog 根据 runId 生成的相对 SSE 订阅路径，例如 /api/v1/runs/run-safe-id/events。"
          type: string
          format: uri-reference
          pattern: '^/api/v1/runs/[A-Za-z0-9._~-]{1,128}/events$'
        result:
          description: "Agent 提供的任意 JSON 结果；无结果时为 null，可以与 failure 同时存在。"
          nullable: true
        failure:
          description: "Agent 提供的公开失败对象，无失败时为 null；Blog 不翻译或解释 code 和 message。"
          type: object
          nullable: true
          required: [code, message]
          properties:
            code:
              description: "Agent 提供的失败代码。"
              type: string
            message:
              description: "Agent 提供的已脱敏失败说明。"
              type: string
        pendingInteraction:
          description: "当前待处理交互，无待处理交互时为 null。"
          type: object
          nullable: true
          required: [interactionId, type, payload]
          properties:
            interactionId:
              description: "Agent 提供的不透明交互标识，Resume 时原样提交。"
              type: string
            type:
              description: "交互类型：`confirmation` 确认，`selection` 选择，`textInput` 文本输入。"
              type: string
              enum: [confirmation, selection, textInput]
            payload:
              description: "Agent 定义的任意 JSON 交互内容，可以为 null。"
              nullable: true
    AgentResumeRequest:
      description: "提交交互决定的 JSON object；Blog 不解释 decision 或 payload，payload 省略与显式 null 由 Agent 区分。"
      type: object
      required: [interactionId, decision]
      properties:
        interactionId:
          description: "非空不透明交互标识，长度 1–128 个 UTF-8 字节（不是字符数）。"
          type: string
          minLength: 1
          x-max-bytes: 128
        decision:
          description: "非空决定字符串，由 Agent 校验，Blog 不限制枚举值。"
          type: string
          minLength: 1
        payload:
          description: "可选的任意 JSON 决定内容；省略与显式 null 含义不同，Blog 保留该区别。"
          nullable: true
    LoginRequest:
      description: "用户名和密码登录凭据。"
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          description: "登录用户名。"
          type: string
          minLength: 1
          maxLength: 64
        password:
          description: "登录密码，不在错误响应中回显。"
          type: string
          minLength: 1
          maxLength: 256
    LoginResponse:
      description: "短期访问令牌。"
      type: object
      additionalProperties: false
