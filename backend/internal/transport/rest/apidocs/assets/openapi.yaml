  /api/v1/runs/{runId}/events:
    get:
      operationId: agentEvents
      tags: [Agent]
      summary: "订阅 Run 事件流"
      description: "使用 fetch 和 ReadableStream 携带 Blog Bearer JWT 读取 SSE，不使用 Cookie、URL token 或原生 EventSource。先查询 Run 完成授权，再订阅；Agent 确认订阅建立后才提交 HTTP 200，不等待首条业务事件，建立前失败返回 Problem Details。Agent 的完整 SSE frame（含 event、id、data、注释和 heartbeat）原样转发并逐条 flush；Blog 不重建事件、不生成序号或 heartbeat，不把 gRPC metadata/trailers 转为 HTTP headers。订阅建立后连续未收到任何 frame 达 idle timeout、流结束或异常时直接关闭，不生成 stream_error。断线后查询 Run：非终态重新订阅，终态停止订阅。Agent 集成关闭时返回 404。"
