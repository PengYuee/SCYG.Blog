openapi: 3.0.3
info:
  title: SCYG Blog Content API
  version: 1.0.0
  description: "SCYG 博客内容 API，提供公开读取和受授权保护的写入。"
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: Articles
    description: "文章读取与维护。"
  - name: ArticleTypes
    description: "文章类型查询与维护。"
  - name: Tags
    description: "标签查询与维护。"
  - name: ArticleImages
    description: "文章正文图片上传、取消与媒体读取。"
  - name: Auth
    description: "身份认证。"
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Auth]
      security: []
      summary: "登录并获取访问令牌"
      description: "使用用户名和密码验证用户身份，成功后返回短期 Bearer JWT。"
      requestBody:
        description: "用户登录凭据。"
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: "登录成功。"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/articles:
    get:
      operationId: listArticles
      security: []
      tags: [Articles]
      summary: "查询已发布文章"
      description: "分页返回状态为 `2`（已发布）且未删除的文章，可按文章类型、标签和关键词筛选。"
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/ArticleTypeFilter'
        - $ref: '#/components/parameters/TagFilter'
        - $ref: '#/components/parameters/SearchFilter'
      responses:
        '200':
          description: "请求成功，返回当前资源或分页响应。"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/articles/{articleId}:
    parameters:
      - $ref: '#/components/parameters/ArticleID'
    get:
      operationId: getArticle
      security: []
      tags: [Articles]
      summary: "获取已发布文章"
      description: "仅在文章状态为 `2`（已发布）且未删除时返回。"
      responses:
        '200':
          description: "请求成功，返回当前资源或分页响应。"
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/manage/articles:
    get:
      operationId: listManageArticles
      tags: [Articles]
      summary: "管理端查询文章"
      description: "受保护地分页返回所有未删除文章，包括草稿、已发布和已归档文章。"
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/ArticleTypeFilter'
        - $ref: '#/components/parameters/TagFilter'
        - $ref: '#/components/parameters/SearchFilter'
      responses:
        '200':
          description: "管理端文章分页。"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createManageArticle
      tags: [Articles]
      summary: "管理端创建文章"
      description: "受保护地创建文章并返回资源、规范地址和强实体标签。"
      requestBody:
        description: "创建文章所需的 JSON 数据。"
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleCreate'
            example: {title: 示例文章, slug: sample-article, digest: 示例摘要, content: 示例正文, articleTypeId: 1, tagIds: [1], status: 1}
      responses:
        '201':
          description: "创建成功，返回当前资源、`Location` 和 `ETag`。"
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/manage/articles/{articleId}:
    parameters:
      - $ref: '#/components/parameters/ArticleID'
    get:
      operationId: getManageArticle
      tags: [Articles]
      summary: "管理端获取文章"
      description: "受保护地获取未删除文章，包括草稿、已发布和已归档文章。"
      responses:
        '200':
          description: "管理端文章详情。"
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: patchManageArticle
      tags: [Articles]
      summary: "管理端部分更新文章"
      description: "受保护地更新文章字段；生命周期迁移使用独立动作接口。`If-Match` 必须与当前版本一致。"
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        description: "管理端文章局部更新字段；不包含生命周期状态。"
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticlePatch'
      responses:
        '200':
          description: "更新成功。"
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteManageArticle
      tags: [Articles]
      summary: "管理端删除文章"
      description: "受保护地软删除文章；`If-Match` 必须与当前版本一致。"
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: "删除成功。"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/manage/articles/{articleId}/publish:
    post:
      operationId: publishManageArticle
      tags: [Articles]
      summary: "管理端发布文章"
      description: "受保护地将草稿发布；`If-Match` 必须与当前版本一致。"
      parameters:
        - $ref: '#/components/parameters/ArticleID'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: "发布成功。"
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/manage/articles/{articleId}/archive:
    post:
      operationId: archiveManageArticle
      tags: [Articles]
      summary: "管理端归档文章"
      description: "受保护地将已发布文章归档；`If-Match` 必须与当前版本一致。"
      parameters:
        - $ref: '#/components/parameters/ArticleID'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: "归档成功。"
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/article-types:
    get:
      operationId: listPublicArticleTypes
      security: []
      tags: [ArticleTypes]
      summary: "查询公开文章类型"
      description: "分页返回有公开文章的未删除文章类型，按公开文章数量降序、标识升序返回。"
      parameters:
        - $ref: '#/components/parameters/PublicPage'
        - $ref: '#/components/parameters/PublicPageSize'
        - $ref: '#/components/parameters/PublicSearchFilter'
      responses:
        '200':
          description: "请求成功。"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicArticleTypeList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/article-types/{articleTypeId}:
    parameters:
      - $ref: '#/components/parameters/ArticleTypeID'
    get:
      operationId: getPublicArticleType
      security: []
      tags: [ArticleTypes]
      summary: "获取公开文章类型"
      description: "返回有公开文章的未删除文章类型。"
      responses:
        '200':
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          description: "请求成功。"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicArticleType'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/tags:
    get:
      operationId: listPublicTags
      security: []
      tags: [Tags]
      summary: "查询公开标签"
      description: "分页返回关联公开文章的未删除标签，按公开文章数量降序、标识升序返回。"
      parameters:
        - $ref: '#/components/parameters/PublicPage'
        - $ref: '#/components/parameters/PublicPageSize'
        - $ref: '#/components/parameters/PublicSearchFilter'
      responses:
        '200':
          description: "请求成功。"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTagList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/tags/{tagId}:
    parameters:
      - $ref: '#/components/parameters/TagID'
    get:
      operationId: getPublicTag
      security: []
      tags: [Tags]
      summary: "获取公开标签"
      description: "返回关联公开文章的未删除标签。"
      responses:
        '200':
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          description: "请求成功。"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTag'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/manage/article-types:
    get:
      operationId: listManageArticleTypes
      tags: [ArticleTypes]
      summary: "管理端查询文章类型"
      description: "受保护地分页返回所有未删除文章类型，包括没有公开文章的项目。"
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/SearchFilter'
      responses:
        '200':
          description: "请求成功。"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleTypeList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createManageArticleType
      tags: [ArticleTypes]
      summary: "管理端创建文章类型"
      description: "受保护地创建文章类型并返回资源、规范地址和强实体标签。"
      requestBody:
        description: "创建文章类型所需的 JSON 数据。"
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleTypeCreate'
      responses:
        '201':
          description: "创建成功。"
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/manage/article-types/{articleTypeId}:
    parameters:
      - $ref: '#/components/parameters/ArticleTypeID'
    get:
      operationId: getManageArticleType
      tags: [ArticleTypes]
      summary: "管理端获取文章类型"
      description: "受保护地按标识获取未删除文章类型，包括没有公开文章的项目。"
      responses:
        '200':
          description: "请求成功。"
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: patchManageArticleType
      tags: [ArticleTypes]
      summary: "管理端更新文章类型"
      description: "受保护地更新文章类型；`If-Match` 必须与当前版本一致。"
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        description: "更新文章类型所需的 JSON 数据。"
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleTypePatch'
      responses:
        '200':
          description: "更新成功。"
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteManageArticleType
      tags: [ArticleTypes]
      summary: "管理端删除文章类型"
      description: "受保护地删除未被引用的文章类型；`If-Match` 必须与当前版本一致。"
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: "删除成功，不返回响应体。"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/manage/tags:
    get:
      operationId: listManageTags
      tags: [Tags]
      summary: "管理端查询标签"
      description: "受保护地分页返回所有未删除标签，包括没有公开文章的项目。"
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/SearchFilter'
      responses:
        '200':
          description: "请求成功。"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createManageTag
      tags: [Tags]
      summary: "管理端创建标签"
      description: "受保护地创建标签并返回资源、规范地址和强实体标签。"
      requestBody:
        description: "创建标签所需的 JSON 数据。"
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCreate'
      responses:
        '201':
          description: "创建成功。"
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/manage/tags/{tagId}:
    parameters:
      - $ref: '#/components/parameters/TagID'
    get:
      operationId: getManageTag
      tags: [Tags]
      summary: "管理端获取标签"
      description: "受保护地按标识获取未删除标签，包括没有公开文章的项目。"
      responses:
        '200':
          description: "请求成功。"
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: patchManageTag
      tags: [Tags]
      summary: "管理端更新标签"
      description: "受保护地更新标签；`If-Match` 必须与当前版本一致。"
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        description: "更新标签所需的 JSON 数据。"
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagPatch'
      responses:
        '200':
          description: "更新成功。"
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteManageTag
      tags: [Tags]
      summary: "管理端删除标签"
      description: "受保护地删除未被引用的标签；`If-Match` 必须与当前版本一致。"
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: "删除成功，不返回响应体。"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/manage/article-images:
    post:
      operationId: createManageArticleImage
      tags: [ArticleImages]
      summary: "管理端上传正文图片"
      description: "受保护地上传单个 JPEG 或 PNG 正文图片，创建有效期内待提交的图片资源。请求只能包含名为 `file` 的必填文件；重复或未知 part 由处理器拒绝。"
      requestBody:
        description: "只包含一个必填二进制 `file` 的 multipart 表单，文件上限为 5 MiB。"
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  description: "JPEG 或 PNG 图片二进制，最大 5 MiB；媒体类型和图像内容由服务端校验。"
                  type: string
                  format: binary
                  maxLength: 5242880
      responses:
        '201':
          description: "上传成功，返回待提交图片及其规范资源地址。"
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleImage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/article-images/{imageId}:
    parameters:
      - $ref: '#/components/parameters/ArticleImageID'
    delete:
      operationId: deleteArticleImage
      tags: [ArticleImages]
      summary: "取消正文图片"
      description: "按图片标识取消当前作者尚未提交的正文图片；已提交或当前状态不允许取消时返回冲突。"
      responses:
        '204':
          description: "取消成功，不返回响应体。"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /media/article-images/{storageKey}:
    parameters:
      - $ref: '#/components/parameters/ArticleImageStorageKey'
    get:
      operationId: getArticleImageMedia
      security: []
      tags: [ArticleImages]
      summary: "读取正文图片媒体"
      description: "按受控存储键读取 JPEG 或 PNG 二进制；实体标签未变化时返回 304。"
      responses:
        '200':
          description: "读取成功，返回原始图片二进制。"
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            image/jpeg:
              schema:
                description: "JPEG 图片二进制。"
                type: string
                format: binary
            image/png:
              schema:
                description: "PNG 图片二进制。"
                type: string
                format: binary
        '304':
          description: "实体标签未变化，不返回响应体。"
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ArticleImageID:
      description: "32 位小写十六进制正文图片标识。"
      name: imageId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ArticleImageID'
    ArticleImageStorageKey:
      description: "32 位小写十六进制正文图片键及 `.jpg` 或 `.png` 扩展名。"
      name: storageKey
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ArticleImageStorageKey'
    ArticleID:
      description: "文章正整数标识。"
      name: articleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PositiveID'
    ArticleTypeID:
      description: "文章类型正整数标识。"
      name: articleTypeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PositiveID'
    TagID:
      description: "标签正整数标识。"
      name: tagId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PositiveID'
    IfMatch:
      description: "强实体标签，内容为当前正整数版本，必须原样提交，例如 `\"1\"`。"
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
        example: '"1"'
    Page:
      description: "从 `1` 开始的页码，默认 `1`。"
      name: page
      in: query
      schema:
        type: integer
        format: int32
        default: 1
        minimum: 1
    PageSize:
      description: "每页数量，默认 `20`，范围 `1` 至 `100`。"
      name: pageSize
      in: query
      schema:
        type: integer
        format: int32
        default: 20
        minimum: 1
        maximum: 100
    PublicPage:
      description: "从 `1` 开始的必填页码。"
      name: page
      in: query
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
    PublicPageSize:
      description: "必填的每页数量，范围 `1` 至 `100`。"
      name: pageSize
      in: query
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
    PublicSearchFilter:
      description: "按名称筛选；服务端先去除首尾空白，再进行不区分大小写的包含匹配。"
      name: q
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 200
        example: Go
    Sort:
      description: "排序：`createdAt` 创建时间升序，`-createdAt` 降序，`updatedAt` 更新时间升序，`-updatedAt` 降序，`title` 标题升序，`-title` 降序。"
      name: sort
      in: query
      schema:
        description: "`createdAt` 创建时间升序，`-createdAt` 创建时间降序，`updatedAt` 更新时间升序，`-updatedAt` 更新时间降序，`title` 标题升序，`-title` 标题降序。"
        type: string
        default: -createdAt
        enum: [createdAt, -createdAt, updatedAt, -updatedAt, title, -title]
        example: -createdAt
    ArticleTypeFilter:
      description: "按文章类型标识筛选文章，例如 `1`。"
      name: articleTypeId
      in: query
      schema:
        $ref: '#/components/schemas/PositiveID'
    TagFilter:
      description: "按标签标识筛选文章，例如 `1`。"
      name: tagId
      in: query
      schema:
        $ref: '#/components/schemas/PositiveID'
    SearchFilter:
      description: "按关键词筛选可搜索文本，例如 `Go`。"
      name: q
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 200
        example: Go
  headers:
    ETag:
      description: "强实体标签，内容为当前正整数版本，例如 `\"1\"`。"
      required: true
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
        example: '"1"'
    Location:
      description: "新资源规范 URI，例如 `/api/v1/manage/articles/1`。"
      required: true
      schema:
        type: string
        format: uri-reference
  responses:
    BadRequest:
      description: "HTTP `400`，请求参数或请求体校验失败。"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: "HTTP `401`，缺少或无法验证认证凭据。"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: "HTTP `403`，写操作授权被拒绝。"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: "HTTP `404`，资源不存在或不可公开访问。"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: "HTTP `409`，唯一性或业务前置条件冲突。"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: "HTTP `412`，`If-Match` 已过期，与当前版本不一致。"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: "HTTP `428`，缺少 `If-Match` 请求头。"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: "HTTP `500`，服务发生未处理错误。"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    LoginRequest:
      description: "用户名和密码登录凭据。"
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          description: "登录用户名。"
          type: string
          minLength: 1
          maxLength: 64
        password:
          description: "登录密码，不在错误响应中回显。"
          type: string
          minLength: 1
          maxLength: 256
    LoginResponse:
      description: "短期访问令牌。"
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresAt]
      properties:
        accessToken:
          description: "短期 Bearer 访问令牌。"
          type: string
          minLength: 1
        tokenType:
          description: "令牌类型：`Bearer` 表示 HTTP Bearer 认证。"
          type: string
          enum: [Bearer]
        expiresAt:
          description: "令牌过期时间。"
          type: string
          format: date-time
    ArticleImageID:
      description: "正文图片标识，固定为 32 位小写十六进制字符串。"
      type: string
      minLength: 32
      maxLength: 32
      pattern: '^[0-9a-f]{32}$'
      example: 0123456789abcdef0123456789abcdef
    ArticleImageStorageKey:
      description: "受控存储键，由 32 位小写十六进制字符串和 `.jpg` 或 `.png` 扩展名组成。"
      type: string
      minLength: 36
      maxLength: 36
      pattern: '^[0-9a-f]{32}\.(?:jpg|png)$'
      example: 0123456789abcdef0123456789abcdef.jpg
    ArticleImageMediaType:
      description: "正文图片媒体类型：`jpeg` 表示 JPEG，`png` 表示 PNG。"
      type: string
      enum: [jpeg, png]
      x-enum-varnames: [JPEG, PNG]
    ArticleImageStatus:
      description: "正文图片生命周期状态：`pending` 表示等待文章提交。"
      type: string
      enum: [pending]
      x-enum-varnames: [Pending]
    ArticleImage:
      description: "新上传的待提交正文图片资源。"
      type: object
      additionalProperties: false
      required: [id, storageKey, url, mediaType, byteSize, width, height, status, expiresAt]
      properties:
        id:
          $ref: '#/components/schemas/ArticleImageID'
        storageKey:
          description: "服务端生成的受控存储键。"
          allOf:
            - $ref: '#/components/schemas/ArticleImageStorageKey'
        url:
          description: "正文可引用的站内图片地址。"
          type: string
          format: uri-reference
          pattern: '^/media/article-images/[0-9a-f]{32}\.(?:jpg|png)$'
          example: /media/article-images/0123456789abcdef0123456789abcdef.jpg
        mediaType:
          $ref: '#/components/schemas/ArticleImageMediaType'
        byteSize:
          description: "服务端重编码后图片字节数，最大 5 MiB。"
          type: integer
          format: int64
          minimum: 1
          maximum: 5242880
        width:
          description: "图片像素宽度，范围 `1` 至 `8192`。"
          type: integer
          format: int32
          minimum: 1
          maximum: 8192
        height:
          description: "图片像素高度，范围 `1` 至 `8192`。"
          type: integer
          format: int32
          minimum: 1
          maximum: 8192
        status:
          $ref: '#/components/schemas/ArticleImageStatus'
        expiresAt:
          description: "待提交图片的 UTC 过期时间。"
          type: string
          format: date-time
    PositiveID:
      description: "资源正整数标识，示例 `1`。"
      example: 1
      type: integer
      format: int64
      minimum: 1
    Version:
      description: "资源当前正整数版本，用于并发控制，示例 `1`。"
      example: 1
      type: integer
      format: int64
      minimum: 1
    ArticleCreateStatus:
      description: "文章创建状态：`1` 创建为草稿，`2` 直接发布。"
      example: 1
      type: integer
      format: int32
      enum: [1, 2]
      x-enum-varnames: [ArticleCreateStatusDraft, ArticleCreateStatusPublished]
    ArticleStatus:
      description: "文章状态：`1` 草稿，`2` 已发布，`3` 已归档。"
      example: 2
      type: integer
      format: int32
      enum: [1, 2, 3]
      x-enum-varnames: [Draft, Published, Archived]
    PageInfo:
      description: "分页页码、每页数量和总量信息。"
      type: object
      additionalProperties: false
      required: [number, size, totalItems, totalPages]
      properties:
        number:
          description: "从 `1` 开始的当前页码。"
          type: integer
          format: int32
          minimum: 1
        size:
          description: "每页数量，范围 `1` 至 `100`。"
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        totalItems:
          description: "符合条件的资源总数，可为 `0`。"
          type: integer
          format: int64
          minimum: 0
        totalPages:
          description: "总页数，无结果时为 `0`。"
          type: integer
          format: int64
          minimum: 0
    Problem:
      description: "错误响应信封，描述请求失败原因。"
      example: {type: /problems/validation, title: 请求无效, status: 400, detail: 参数校验失败, instance: /api/v1/articles, requestId: req-1, errors: {title: [标题不能为空]}}
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, requestId, errors]
      properties:
        type:
          description: "问题类型 URI。"
          type: string
          format: uri-reference
        title:
          description: "标题。"
          type: string
          minLength: 1
        status:
          description: "文章状态或问题的 HTTP 状态码。"
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        detail:
          description: "具体错误说明。"
          type: string
          minLength: 1
        instance:
          description: "发生错误的请求 URI。"
          type: string
          format: uri-reference
        requestId:
          description: "请求追踪标识。"
          type: string
          minLength: 1
        errors:
          description: "字段校验错误明细，非校验错误时为空。"
          type: object
          additionalProperties:
            type: array
            minItems: 1
            items:
              type: string
              minLength: 1
    PublicArticleTypeSummary:
      description: "文章所属类型的公开摘要。"
      type: object
      additionalProperties: false
      required: [id, name, image]
      properties:
        id:
          $ref: '#/components/schemas/PositiveID'
        name:
          description: "文章类型名称。"
          type: string
          minLength: 1
          maxLength: 60
        image:
          description: "分类图片地址，未设置时为 `null`。"
          type: string
          maxLength: 512
          nullable: true
    PublicArticleType:
      description: "公开文章类型资源。"
      type: object
      additionalProperties: false
      required: [id, name, image, articleCount]
      properties:
        id:
          $ref: '#/components/schemas/PositiveID'
        name:
          description: "文章类型名称。"
          type: string
          minLength: 1
          maxLength: 60
        image:
          description: "分类图片地址，未设置时为 `null`。"
          type: string
          maxLength: 512
          nullable: true
        articleCount:
          description: "满足公开条件的文章数量。"
          type: integer
          format: int64
          minimum: 1
    PublicTag:
      description: "公开标签资源。"
      type: object
      additionalProperties: false
      required: [id, name, articleCount]
      properties:
        id:
          $ref: '#/components/schemas/PositiveID'
        name:
          description: "标签名称。"
          type: string
          minLength: 1
          maxLength: 60
        articleCount:
          description: "满足公开条件的文章数量。"
          type: integer
          format: int64
          minimum: 1
    PublicArticleTypeList:
      description: "公开文章类型分页响应信封。"
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          description: "当前页公开文章类型数组。"
          type: array
          items:
            $ref: '#/components/schemas/PublicArticleType'
        page:
          $ref: '#/components/schemas/PageInfo'
    PublicTagList:
      description: "公开标签分页响应信封。"
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          description: "当前页公开标签数组。"
          type: array
          items:
            $ref: '#/components/schemas/PublicTag'
        page:
          $ref: '#/components/schemas/PageInfo'
    Article:
      description: "文章资源，包含所属类型、标签关系、状态、计数、版本和 UTC 时间。"
      type: object
      additionalProperties: false
      required: [id, title, slug, digest, content, articleTypeId, articleType, tagIds, status, support, comment, visited, version, createdAt, updatedAt]
      properties:
        title:
          description: "标题。"
          type: string
          minLength: 1
          maxLength: 120
        slug:
          description: "规范短标识，例如 `hello-world`。"
          type: string
          minLength: 1
          maxLength: 160
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        digest:
          description: "文章摘要。"
          type: string
          minLength: 1
          maxLength: 500
        content:
          description: "文章正文。"
          type: string
          minLength: 1
        id:
          $ref: '#/components/schemas/PositiveID'
        articleTypeId:
          $ref: '#/components/schemas/PositiveID'
        articleType:
          $ref: '#/components/schemas/PublicArticleTypeSummary'
        tagIds:
          description: "关联标签正整数标识数组，值不重复。"
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PositiveID'
        status:
          $ref: '#/components/schemas/ArticleStatus'
        support:
          description: "获赞次数，非负。"
          type: integer
          format: int64
          minimum: 0
        comment:
          description: "评论次数，非负。"
          type: integer
          format: int64
          minimum: 0
        visited:
          description: "访问次数，非负。"
          type: integer
          format: int64
          minimum: 0
        version:
          $ref: '#/components/schemas/Version'
        createdAt:
          description: "UTC 创建时间，例如 `2026-01-01T00:00:00Z`。"
          type: string
          format: date-time
        updatedAt:
          description: "UTC 更新时间，从未更新时为 `null`。"
          type: string
          format: date-time
          nullable: true
    ArticleCreate:
      description: "创建文章的完整输入。"
      type: object
      additionalProperties: false
      required: [title, slug, digest, content, articleTypeId, tagIds, status]
      properties:
        title:
          description: "标题。"
          type: string
          minLength: 1
          maxLength: 120
        slug:
          description: "规范短标识，例如 `hello-world`。"
          type: string
          minLength: 1
          maxLength: 160
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        digest:
          description: "文章摘要。"
          type: string
          minLength: 1
          maxLength: 500
        content:
          description: "文章正文。"
          type: string
          minLength: 1
        articleTypeId:
          $ref: '#/components/schemas/PositiveID'
        tagIds:
          description: "关联标签正整数标识数组，值不重复。"
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PositiveID'
        status:
          $ref: '#/components/schemas/ArticleCreateStatus'
    ArticlePatch:
      description: "文章局部更新输入，至少提供一个字段，其他字段保持不变。"
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          description: "标题。"
          type: string
          minLength: 1
          maxLength: 120
        slug:
          description: "规范短标识，例如 `hello-world`。"
          type: string
          minLength: 1
          maxLength: 160
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        digest:
          description: "文章摘要。"
          type: string
          minLength: 1
          maxLength: 500
        content:
          description: "文章正文。"
          type: string
          minLength: 1
        articleTypeId:
          $ref: '#/components/schemas/PositiveID'
        tagIds:
          description: "关联标签正整数标识数组，值不重复。"
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PositiveID'
    ArticleType:
      description: "文章类型资源，包含可空图片、非负菜单排序值、版本和 UTC 时间。"
      type: object
      additionalProperties: false
      required: [id, name, image, menu, version, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/PositiveID'
        name:
          description: "资源名称。"
          type: string
          minLength: 1
          maxLength: 60
        image:
          description: "图片地址，未设置时为 `null`，例如 `https://example.com/type.png`。"
          type: string
          maxLength: 512
          nullable: true
        menu:
          description: "非负菜单排序值，不约定排序方向。"
          type: integer
          format: int32
          minimum: 0
        version:
          $ref: '#/components/schemas/Version'
        createdAt:
          description: "UTC 创建时间，例如 `2026-01-01T00:00:00Z`。"
          type: string
          format: date-time
        updatedAt:
          description: "UTC 更新时间，从未更新时为 `null`。"
          type: string
          format: date-time
          nullable: true
