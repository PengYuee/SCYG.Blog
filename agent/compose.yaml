name: ${SCYG_COMPOSE_PROJECT_NAME:-scyg-agent-local}

services:
  redis:
    image: redis:7.4-alpine@sha256:fd2f8954a0f6bb24cd8819c9a1bf7e033efe9969d3b571104abb9a58c61e7068
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - scyg_agent_local
    restart: unless-stopped
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
  postgres:
    # PostgreSQL 17.5 Bookworm; digest is immutable.
    image: postgres:17.5-bookworm@sha256:aadf2c0696f5ef357aa7a68da995137f0cf17bad0bf6e1f17de06ae5c769b302
    environment:
      POSTGRES_DB: scyg_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SCYG_POSTGRES_PASSWORD:?请设置本地 PostgreSQL 管理员密码}
      SCYG_AGENT_DB_PASSWORD: ${SCYG_AGENT_DB_PASSWORD:?请设置 Agent 数据库角色密码}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    ports:
      - "127.0.0.1:${SCYG_POSTGRES_PORT:-5432}:5432"
    volumes:
      - scyg_agent_postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init/001_roles.sql:/docker-entrypoint-initdb.d/001_roles.sql:ro
    networks:
      - scyg_agent_local
    restart: unless-stopped
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true

  agent-setup:
    build:
      context: ..
      dockerfile: agent/Dockerfile
      target: runtime
    entrypoint: ["/opt/venv/bin/python", "-m", "scyg_agent.deployment"]
    environment:
      SCYG_DEPLOY_ADMIN_DATABASE_URL: ${SCYG_POSTGRES_ADMIN_DATABASE_URL:?请设置管理员数据库 DSN}
      SCYG_DEPLOY_ADMIN_DATABASE_PASSWORD: ${SCYG_POSTGRES_PASSWORD:?请设置本地 PostgreSQL 管理员密码}
      SCYG_DEPLOY_AGENT_DATABASE_URL: ${SCYG_AGENT_DATABASE_URL:?请设置 Agent 数据库 DSN}
      SCYG_DEPLOY_AGENT_DATABASE_PASSWORD: ${SCYG_AGENT_DB_PASSWORD:?请设置 Agent 数据库角色密码}
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    networks:
      - scyg_agent_local
    read_only: true
    user: "10001:10001"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      - /var/tmp/scyg-agent:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  agent:
    build:
      context: ..
      dockerfile: agent/Dockerfile
      target: runtime
    environment:
      SCYG_AGENT_HTTP_HOST: 0.0.0.0
      SCYG_AGENT_HTTP_PORT: "8080"
      SCYG_AGENT_GRPC_HOST: 0.0.0.0
      SCYG_AGENT_GRPC_PORT: "9090"
      SCYG_AGENT_DATABASE_URL: ${SCYG_AGENT_DATABASE_URL:?请设置 Agent 数据库 DSN}
      SCYG_AGENT_MODELS__PROTOCOL: ${SCYG_AGENT_MODELS__PROTOCOL:-chat_completions}
      SCYG_AGENT_MODELS__FAST__MODEL: ${SCYG_AGENT_MODELS__FAST__MODEL:?Set fast model}
      SCYG_AGENT_MODELS__FAST__BASE_URL: ${SCYG_AGENT_MODELS__FAST__BASE_URL:?Set fast base URL}
      SCYG_AGENT_MODELS__FAST__API_KEY: ${SCYG_AGENT_MODELS__FAST__API_KEY:?Set fast API key}
      SCYG_AGENT_MODELS__FAST__TIMEOUT_SECONDS: ${SCYG_AGENT_MODELS__FAST__TIMEOUT_SECONDS:-60}
      SCYG_AGENT_MODELS__STANDARD__MODEL: ${SCYG_AGENT_MODELS__STANDARD__MODEL:?Set standard model}
      SCYG_AGENT_MODELS__STANDARD__BASE_URL: ${SCYG_AGENT_MODELS__STANDARD__BASE_URL:?Set standard base URL}
      SCYG_AGENT_MODELS__STANDARD__API_KEY: ${SCYG_AGENT_MODELS__STANDARD__API_KEY:?Set standard API key}
      SCYG_AGENT_MODELS__STANDARD__TIMEOUT_SECONDS: ${SCYG_AGENT_MODELS__STANDARD__TIMEOUT_SECONDS:-120}
      SCYG_AGENT_MODELS__STRONG__MODEL: ${SCYG_AGENT_MODELS__STRONG__MODEL:?Set strong model}
      SCYG_AGENT_MODELS__STRONG__BASE_URL: ${SCYG_AGENT_MODELS__STRONG__BASE_URL:?Set strong base URL}
      SCYG_AGENT_MODELS__STRONG__API_KEY: ${SCYG_AGENT_MODELS__STRONG__API_KEY:?Set strong API key}
      SCYG_AGENT_MODELS__STRONG__TIMEOUT_SECONDS: ${SCYG_AGENT_MODELS__STRONG__TIMEOUT_SECONDS:-180}
      SCYG_AGENT_WORKER_CONCURRENCY: ${SCYG_AGENT_WORKER_CONCURRENCY:-4}
      SCYG_AGENT_BLOG_GRPC_TARGET: ${SCYG_AGENT_BLOG_GRPC_TARGET:?请设置 Blog gRPC 地址}
      SCYG_AGENT_REDIS_URL: redis://redis:6379/0
      SCYG_AGENT_REDIS_TTL_SECONDS: "86400"
      SCYG_AGENT_REDIS_STREAM_MAXLEN: "10000"
      SCYG_AGENT_REDIS_CONNECT_TIMEOUT_SECONDS: "5"
      SCYG_AGENT_REDIS_READ_TIMEOUT_SECONDS: "30"
      SCYG_AGENT_SHUTDOWN_SECONDS: "30"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
      agent-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c", "import json,sys,urllib.request; response=urllib.request.urlopen('http://127.0.0.1:8080/health/ready',timeout=2); payload=json.load(response); response.close(); sys.exit(0 if payload.get('ready') is True else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    ports:
      - "127.0.0.1:${SCYG_AGENT_HTTP_PORT:-8080}:8080"
    networks:
      - scyg_agent_local
    read_only: true
    user: "10001:10001"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      - /var/tmp/scyg-agent:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 40s

volumes:
  scyg_agent_postgres_data:

networks:
  scyg_agent_local:
    driver: bridge
