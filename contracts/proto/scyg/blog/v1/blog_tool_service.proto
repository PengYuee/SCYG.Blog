syntax = "proto3";

package scyg.blog.v1;

import "buf/validate/validate.proto";
import "scyg/blog/v1/article.proto";
import "scyg/blog/v1/common.proto";

// Compatibility policy: RPC names and published field numbers are immutable.
// Removed fields are reserved; writes retain operation_id idempotency semantics.

// BlogToolService exposes only allowlisted article capabilities to Agent runtimes.
service BlogToolService {
  // GetPublishedArticle returns one published, nondeleted article.
  rpc GetPublishedArticle(GetPublishedArticleRequest) returns (GetPublishedArticleResponse);
  // SearchArticles searches published, nondeleted articles.
  rpc SearchArticles(SearchArticlesRequest) returns (SearchArticlesResponse);
  // CreateArticleDraft creates one idempotent draft.
  rpc CreateArticleDraft(CreateArticleDraftRequest) returns (CreateArticleDraftResponse);
  // UpdateArticleDraft updates one draft using optimistic concurrency.
  rpc UpdateArticleDraft(UpdateArticleDraftRequest) returns (UpdateArticleDraftResponse);
  // PublishArticle publishes one draft using optimistic concurrency.
  rpc PublishArticle(PublishArticleRequest) returns (PublishArticleResponse);
  // AddArticleTags adds allowlisted tags using optimistic concurrency.
  rpc AddArticleTags(AddArticleTagsRequest) returns (AddArticleTagsResponse);
}

// GetPublishedArticleRequest identifies one public article read.
message GetPublishedArticleRequest {
  // metadata carries run, tool-call, and trace identity.
  ToolRequestMetadata metadata = 1 [(buf.validate.field).required = true];
  // article_id identifies the requested article.
  ArticleId article_id = 2 [(buf.validate.field).required = true];
}

// GetPublishedArticleResponse returns one gRPC-specific article projection.
message GetPublishedArticleResponse {
  // article is the authoritative published article.
  Article article = 1 [(buf.validate.field).required = true];
}

// SearchArticlesRequest carries a bounded published-article query.
message SearchArticlesRequest {
  // metadata carries run, tool-call, and trace identity.
  ToolRequestMetadata metadata = 1 [(buf.validate.field).required = true];
  // query is the required full-text search input.
  string query = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
  // page_size limits results returned in one response.
  uint32 page_size = 3 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 100
  }];
  // page_token is an opaque continuation token returned by this RPC.
  optional string page_token = 4 [(buf.validate.field).string = {max_len: 512}];
}

// SearchArticlesResponse returns a bounded page of search projections.
message SearchArticlesResponse {
  // articles contains published, nondeleted matches.
  repeated ArticleSearchHit articles = 1 [(buf.validate.field).repeated = {max_items: 100}];
  // next_page_token is present when another page exists.
  optional string next_page_token = 2 [(buf.validate.field).string = {max_len: 512}];
}

// CreateArticleDraftRequest creates an attributed draft exactly once.
message CreateArticleDraftRequest {
  // metadata carries write idempotency and audit identity.
  WriteOperationMetadata metadata = 1 [(buf.validate.field).required = true];
  // author_user_id identifies the Blog user attributed to the draft.
  UserId author_user_id = 2 [(buf.validate.field).required = true];
  // title is the initial article title.
  string title = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 300
  }];
  // body_markdown is the initial Markdown content.
  string body_markdown = 4 [(buf.validate.field).string = {max_len: 1000000}];
  // summary is the initial bounded synopsis.
  string summary = 5 [(buf.validate.field).string = {max_len: 2000}];
}

// CreateArticleDraftResponse returns the created or idempotently replayed draft.
message CreateArticleDraftResponse {
  // article is the authoritative draft state.
  Article article = 1 [(buf.validate.field).required = true];
}

// UpdateArticleDraftRequest replaces mutable draft content at an expected version.
message UpdateArticleDraftRequest {
  // metadata carries write idempotency and audit identity.
  WriteOperationMetadata metadata = 1 [(buf.validate.field).required = true];
  // article_id identifies the draft.
  ArticleId article_id = 2 [(buf.validate.field).required = true];
  // expected_version enforces strong optimistic concurrency.
  uint64 expected_version = 3 [(buf.validate.field).uint64 = {gte: 1}];
  // title is the replacement title.
  string title = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 300
  }];
  // body_markdown is the replacement Markdown content.
  string body_markdown = 5 [(buf.validate.field).string = {max_len: 1000000}];
  // summary is the replacement bounded synopsis.
  string summary = 6 [(buf.validate.field).string = {max_len: 2000}];
}

// UpdateArticleDraftResponse returns the updated or idempotently replayed draft.
message UpdateArticleDraftResponse {
  // article is the authoritative updated draft.
  Article article = 1 [(buf.validate.field).required = true];
}

// PublishArticleRequest publishes a draft at an expected version.
message PublishArticleRequest {
  // metadata carries write idempotency and audit identity.
  WriteOperationMetadata metadata = 1 [(buf.validate.field).required = true];
  // article_id identifies the draft to publish.
  ArticleId article_id = 2 [(buf.validate.field).required = true];
  // expected_version enforces strong optimistic concurrency.
  uint64 expected_version = 3 [(buf.validate.field).uint64 = {gte: 1}];
}

// PublishArticleResponse returns the published or idempotently replayed article.
message PublishArticleResponse {
  // article is the authoritative published article.
  Article article = 1 [(buf.validate.field).required = true];
}

// AddArticleTagsRequest adds existing tags at an expected article version.
message AddArticleTagsRequest {
  // metadata carries write idempotency and audit identity.
  WriteOperationMetadata metadata = 1 [(buf.validate.field).required = true];
  // article_id identifies the target article.
  ArticleId article_id = 2 [(buf.validate.field).required = true];
  // expected_version enforces strong optimistic concurrency.
  uint64 expected_version = 3 [(buf.validate.field).uint64 = {gte: 1}];
  // tag_ids identifies the existing tags to add.
  repeated TagId tag_ids = 4 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
  }];
}

// AddArticleTagsResponse returns the updated or idempotently replayed article.
message AddArticleTagsResponse {
  // article is the authoritative tagged article.
  Article article = 1 [(buf.validate.field).required = true];
}
