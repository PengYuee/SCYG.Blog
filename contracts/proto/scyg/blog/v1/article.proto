syntax = "proto3";

package scyg.blog.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "scyg/blog/v1/common.proto";

// Tag is the current tag projection with a numeric resource identifier.
message Tag {
  reserved 1;

  string name = 2 [(buf.validate.field).string.min_len = 1];
  int64 id = 3 [(buf.validate.field).int64.gt = 0];
}

// ArticleType is the read-only article classification projection.
message ArticleType {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  string name = 2 [(buf.validate.field).string.min_len = 1];
}

// Article projects current management content independently of REST bindings.
message Article {
  reserved 1, 3, 4;
  reserved "body_markdown", "summary";

  string title = 2 [(buf.validate.field).string.min_len = 1];
  ArticleStatus status = 5 [(buf.validate.field).enum = {defined_only: true not_in: [0]}];
  repeated Tag tags = 6;
  uint64 version = 7 [(buf.validate.field).uint64.gte = 1];
  google.protobuf.Timestamp created_at = 8 [(buf.validate.field).required = true];
  google.protobuf.Timestamp updated_at = 9 [(buf.validate.field).required = true];
  optional google.protobuf.Timestamp published_at = 10;
  int64 id = 11 [(buf.validate.field).int64.gt = 0];
  int64 article_type_id = 12 [(buf.validate.field).int64.gt = 0];
  string content = 13;
  string digest = 14;
  string slug = 15;
  int64 support = 16;
  int64 comment = 17;
  int64 visited = 18;
}
