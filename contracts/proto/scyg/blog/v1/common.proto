syntax = "proto3";

package scyg.blog.v1;

import "buf/validate/validate.proto";

// Compatibility policy: published field numbers and enum values are immutable.
// Removed fields and values are reserved; additive fields use new numbers only.

// ToolRequestMetadata carries audit and trace identity for one Blog tool call.
message ToolRequestMetadata {
  // request_id uniquely identifies this RPC attempt.
  string request_id = 1 [(buf.validate.field).string = {pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"}];
  // correlation_id groups calls belonging to one business flow.
  string correlation_id = 2 [(buf.validate.field).string = {pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"}];
  // causation_id identifies the event or command that caused this tool call.
  optional string causation_id = 3 [(buf.validate.field).string = {pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"}];
  // run_id identifies the Agent run for audit ownership.
  string run_id = 4 [(buf.validate.field).string = {pattern: "^run_[A-Za-z0-9][A-Za-z0-9_-]{7,63}$"}];
  // tool_call_id identifies one logical runtime tool invocation.
  string tool_call_id = 5 [(buf.validate.field).string = {pattern: "^tool_[A-Za-z0-9][A-Za-z0-9_-]{7,63}$"}];
}

// WriteOperationMetadata extends trace identity with write idempotency.
message WriteOperationMetadata {
  // request identifies the originating run and tool call.
  ToolRequestMetadata request = 1 [(buf.validate.field).required = true];
  // operation_id is stable across retries and uniquely identifies the write effect.
  string operation_id = 2 [(buf.validate.field).string = {pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,191}$"}];
}

// ArticleId identifies one Blog article without exposing persistence keys.
message ArticleId {
  // value is the opaque stable article identifier.
  string value = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

// TagId identifies one allowlisted Blog tag.
message TagId {
  // value is the opaque stable tag identifier.
  string value = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

// UserId identifies the Blog user attributed to a write.
message UserId {
  // value is the opaque stable user identifier.
  string value = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

// ArticleStatus describes externally meaningful article lifecycle states.
enum ArticleStatus {
  // ARTICLE_STATUS_UNSPECIFIED is invalid for returned articles.
  ARTICLE_STATUS_UNSPECIFIED = 0;
  // ARTICLE_STATUS_DRAFT is visible only to authorized internal operations.
  ARTICLE_STATUS_DRAFT = 1;
  // ARTICLE_STATUS_PUBLISHED is visible to public read operations.
  ARTICLE_STATUS_PUBLISHED = 2;
}

// ErrorCode provides stable application meaning for canonical gRPC error details.
enum ErrorCode {
  // ERROR_CODE_UNSPECIFIED is not a valid mapped error.
  ERROR_CODE_UNSPECIFIED = 0;
  // ERROR_CODE_VALIDATION maps to InvalidArgument.
  ERROR_CODE_VALIDATION = 1;
  // ERROR_CODE_PERMISSION_DENIED maps to PermissionDenied.
  ERROR_CODE_PERMISSION_DENIED = 2;
  // ERROR_CODE_NOT_FOUND maps to NotFound.
  ERROR_CODE_NOT_FOUND = 3;
  // ERROR_CODE_ALREADY_EXISTS maps to AlreadyExists.
  ERROR_CODE_ALREADY_EXISTS = 4;
  // ERROR_CODE_FAILED_PRECONDITION maps to FailedPrecondition.
  ERROR_CODE_FAILED_PRECONDITION = 5;
  // ERROR_CODE_VERSION_REQUIRED maps to FailedPrecondition.
  ERROR_CODE_VERSION_REQUIRED = 6;
  // ERROR_CODE_STALE_VERSION maps to Aborted.
  ERROR_CODE_STALE_VERSION = 7;
  // ERROR_CODE_INTERNAL maps to Internal.
  ERROR_CODE_INTERNAL = 8;
}

// FieldViolation is attached to InvalidArgument status details.
message FieldViolation {
  // field is the protobuf field path that failed validation.
  string field = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // description is a stable, value-free validation explanation.
  string description = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
}

// ErrorDetail is attached to canonical gRPC status and is never a success wrapper.
message ErrorDetail {
  // code carries stable application meaning.
  ErrorCode code = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // retryable states whether retrying may succeed without input changes.
  bool retryable = 2;
  // violations identifies malformed fields when relevant.
  repeated FieldViolation violations = 3 [(buf.validate.field).repeated = {max_items: 32}];
}
