syntax = "proto3";

package scyg.agent.v1;

import "buf/validate/validate.proto";
import "scyg/agent/v1/common.proto";

// Compatibility policy: RPC names and published field numbers are immutable.
// Removed fields are reserved and responses remain RPC-specific.

// AgentControlService exposes the Blog API control-plane operations.
service AgentControlService {
  // CreateRun creates one idempotent durable run.
  rpc CreateRun(CreateRunRequest) returns (CreateRunResponse);
  // CreateAgentRun creates a capability-selected idempotent run.
  rpc CreateAgentRun(CreateAgentRunRequest) returns (CreateAgentRunResponse);
  // GetRun returns the latest durable run snapshot.
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
}

// CreateRunRequest carries validated task intent from the Blog API.
message CreateRunRequest {
  // metadata carries request tracing semantics.
  RequestMetadata metadata = 1 [(buf.validate.field).required = true];
  // operation_id makes run creation idempotent across retries.
  string operation_id = 2 [(buf.validate.field).string = {pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"}];
  // owner_user_id identifies the authenticated run owner.
  UserId owner_user_id = 3 [(buf.validate.field).required = true];
  // task_type selects a static task catalog entry.
  TaskType task_type = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // runtime freezes the runtime profile selected by the Blog API.
  RuntimeSelection runtime = 5 [(buf.validate.field).required = true];
  // initial_message is the bounded user instruction for the task.
  string initial_message = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 16000
  }];
  // article_id provides optional Blog article context.
  optional ArticleId article_id = 7;
}

// CreateRunResponse returns the created or idempotently replayed run.
message CreateRunResponse {
  // run is the authoritative control-plane snapshot.
  Run run = 1 [(buf.validate.field).required = true];
}

// CreateAgentRunRequest intentionally excludes recipe, model, tool, and runtime choices.
message CreateAgentRunRequest {
  RequestMetadata metadata = 1 [(buf.validate.field).required = true];
  string idempotency_key = 2 [(buf.validate.field).string = {min_len: 1 max_len: 128}];
  UserId user_id = 3 [(buf.validate.field).required = true];
  AgentCapability capability = 4 [(buf.validate.field).enum = {defined_only: true not_in: [0]}];
  string locale = 5 [(buf.validate.field).string = {min_len: 1 max_len: 32}];
  oneof input {
    SearchInput search = 10;
    WritingInput writing = 11;
    PolishInput polish = 12;
    ChatInput chat = 13;
  }
}

message CreateAgentRunResponse {
  Run run = 1 [(buf.validate.field).required = true];
}

// GetRunRequest identifies a run and its expected owner.
message GetRunRequest {
  // metadata carries request tracing semantics.
  RequestMetadata metadata = 1 [(buf.validate.field).required = true];
  // run_id identifies the requested run.
  RunId run_id = 2 [(buf.validate.field).required = true];
  // owner_user_id prevents accidental cross-owner lookup.
  UserId owner_user_id = 3 [(buf.validate.field).required = true];
}

// GetRunResponse returns one authoritative run snapshot.
message GetRunResponse {
  // run is the current durable state.
  Run run = 1 [(buf.validate.field).required = true];
}
