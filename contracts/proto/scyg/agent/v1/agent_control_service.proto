syntax = "proto3";

package scyg.agent.v1;

import "buf/validate/validate.proto";
import "scyg/agent/v1/common.proto";

// AgentControlService is the internal, owner-authorized Blog control plane.
service AgentControlService {
  rpc CreateRun(CreateRunRequest) returns (Run);
  rpc GetRun(GetRunRequest) returns (Run);
  rpc StreamRunEvents(StreamRunEventsRequest) returns (stream RunEventFrame);
  rpc ResumeRun(ResumeRunRequest) returns (Run);
  rpc CancelRun(CancelRunRequest) returns (Run);
}

// CreateRunRequest carries raw JSON, not runtime or recipe selections.
message CreateRunRequest {
  reserved 1 to 7;
  reserved "metadata", "operation_id", "owner_user_id", "task_type", "runtime", "initial_message", "article_id";

  string user_id = 8 [(buf.validate.field).string = {min_bytes: 1 max_bytes: 128}];
  string idempotency_key = 9 [(buf.validate.field).string.pattern = "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"];
  AgentCapability capability = 10 [(buf.validate.field).enum = {defined_only: true not_in: [0]}];
  bytes json_payload = 11 [(buf.validate.field).bytes = {min_len: 1 max_len: 1048576}];
}

// GetRunRequest addresses an opaque URL-safe run owned by user_id.
message GetRunRequest {
  reserved 1 to 3;
  reserved "metadata", "owner_user_id";

  string user_id = 4 [(buf.validate.field).string = {min_bytes: 1 max_bytes: 128}];
  string run_id = 5 [(buf.validate.field).string = {pattern: "^[A-Za-z0-9._~-]{1,128}$" not_in: [".", ".."]}];
}

// StreamRunEventsRequest forwards the browser cursor without interpretation by Blog.
message StreamRunEventsRequest {
  string user_id = 1 [(buf.validate.field).string = {min_bytes: 1 max_bytes: 128}];
  string run_id = 2 [(buf.validate.field).string = {pattern: "^[A-Za-z0-9._~-]{1,128}$" not_in: [".", ".."]}];
  optional string after_event_id = 3 [(buf.validate.field).string = {pattern: "^[\\x00-\\x7F]{1,256}$"}];
}

// RunEventFrame contains one complete SSE frame, including its terminating newline.
message RunEventFrame {
  bytes frame = 1 [(buf.validate.field).bytes.min_len = 1];
}

// ResumeRunRequest preserves missing payload separately from explicit JSON null.
message ResumeRunRequest {
  string user_id = 1 [(buf.validate.field).string = {min_bytes: 1 max_bytes: 128}];
  string run_id = 2 [(buf.validate.field).string = {pattern: "^[A-Za-z0-9._~-]{1,128}$" not_in: [".", ".."]}];
  string idempotency_key = 3 [(buf.validate.field).string.pattern = "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"];
  string interaction_id = 4 [(buf.validate.field).string = {min_bytes: 1 max_bytes: 128}];
  string decision = 5 [(buf.validate.field).string.min_len = 1];
  optional bytes payload_json = 6 [(buf.validate.field).bytes = {min_len: 1 max_len: 1048576}];
}

// CancelRunRequest establishes a durable cancellation fence.
message CancelRunRequest {
  string user_id = 1 [(buf.validate.field).string = {min_bytes: 1 max_bytes: 128}];
  string run_id = 2 [(buf.validate.field).string = {pattern: "^[A-Za-z0-9._~-]{1,128}$" not_in: [".", ".."]}];
  string idempotency_key = 3 [(buf.validate.field).string.pattern = "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"];
}
