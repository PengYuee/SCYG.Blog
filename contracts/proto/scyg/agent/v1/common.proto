syntax = "proto3";

package scyg.agent.v1;

import "buf/validate/validate.proto";

// AgentCapability is the only client-selectable execution capability.
enum AgentCapability {
  AGENT_CAPABILITY_UNSPECIFIED = 0;
  AGENT_CAPABILITY_SEARCH = 1;
  AGENT_CAPABILITY_WRITE = 2;
  AGENT_CAPABILITY_POLISH = 3;
  AGENT_CAPABILITY_CHAT = 4;
}

// RunStatus projects durable internal states without exposing runtime selection.
enum RunStatus {
  reserved 1, 3, 4;
  reserved "RUN_STATUS_PENDING", "RUN_STATUS_WAITING_INPUT", "RUN_STATUS_PENDING_RESUME";

  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_RUNNING = 2;
  RUN_STATUS_SUCCEEDED = 5;
  RUN_STATUS_FAILED = 6;
  RUN_STATUS_CANCELLED = 7;
  RUN_STATUS_QUEUED = 8;
  RUN_STATUS_WAITING_FOR_APPROVAL = 9;
}

// InteractionType describes the browser-visible interaction shape.
enum InteractionType {
  INTERACTION_TYPE_UNSPECIFIED = 0;
  INTERACTION_TYPE_CONFIRMATION = 1;
  INTERACTION_TYPE_SELECTION = 2;
  INTERACTION_TYPE_TEXT_INPUT = 3;
}

// PublicError is a sanitized failure or canonical gRPC status detail.
message PublicError {
  string code = 1 [(buf.validate.field).string.min_len = 1];
  string message = 2 [(buf.validate.field).string.min_len = 1];
}

// PendingInteraction contains the interaction currently awaiting a response.
message PendingInteraction {
  string interaction_id = 1 [(buf.validate.field).string = {min_bytes: 1 max_bytes: 128}];
  InteractionType type = 2 [(buf.validate.field).enum = {defined_only: true not_in: [0]}];
  bytes payload_json = 3 [(buf.validate.field).bytes.min_len = 1];
}

// Run is one owner-authorized, consistent snapshot returned by all unary RPCs.
message Run {
  reserved 1 to 4, 6 to 10;
  reserved "id", "owner_user_id", "task_type", "runtime", "article_id", "revision";

  RunStatus status = 5 [(buf.validate.field).enum = {defined_only: true not_in: [0]}];
  string run_id = 11 [(buf.validate.field).string = {
    pattern: "^[A-Za-z0-9._~-]{1,128}$"
    not_in: [".", ".."]
  }];
  AgentCapability capability = 12 [(buf.validate.field).enum = {defined_only: true not_in: [0]}];
  string recipe_id = 13 [(buf.validate.field).string.min_len = 1];
  string recipe_version = 14 [(buf.validate.field).string.min_len = 1];
  // Timestamps are RFC 3339 UTC strings.
  string created_at = 15 [(buf.validate.field).string.min_len = 1];
  string updated_at = 16 [(buf.validate.field).string.min_len = 1];
  PublicError failure = 17;
  // Presence distinguishes no result from a JSON null result.
  optional bytes result_json = 18;
  PendingInteraction pending_interaction = 19;
}
