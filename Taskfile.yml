version: '3'

vars:
  TASK_VERSION: v3.49.1
  UV_VERSION: 0.11.28

tasks:
  default:
    desc: Run the complete Agent QA gate
    cmds:
      - task: qa:agent

  task:version:check:
    desc: Require the repository-wide pinned Task runner
    cmds:
      - cmd: >-
          powershell.exe -NoProfile -Command
          "if ((& '{{.TASK_EXE}}' --version).Trim() -ne '{{trimPrefix "v" .TASK_VERSION}}') { Write-Error '必须使用 Task {{.TASK_VERSION}}'; exit 1 }"
        platforms: [windows]
      - cmd: >-
          sh -c 'test "$("{{.TASK_EXE}}" --version)" = "{{trimPrefix "v" .TASK_VERSION}}"'
        platforms: [linux, darwin]

  uv:version:check:
    desc: Require the pinned uv command used by the dependency audit
    cmds:
      - cmd: >-
          powershell.exe -NoProfile -Command
          "if (-not (Get-Command uv -ErrorAction SilentlyContinue)) { Write-Error 'uv {{.UV_VERSION}} is required'; exit 1 }; if ((uv --version).Trim() -notmatch '^uv {{.UV_VERSION}}( |$)') { Write-Error '必须使用 uv {{.UV_VERSION}}'; exit 1 }"
        platforms: [windows]
      - cmd: >-
          sh -c 'command -v uv >/dev/null && test "$(uv --version | awk "{print \$2}")" = "{{.UV_VERSION}}"'
        platforms: [linux, darwin]

  qa:agent:
    desc: Run full Agent contract, quality, deployment and T32 topology gates
    cmds:
      - task: task:version:check
      - task: uv:version:check
      - task: agent:install
      - cmd: uv run --locked --no-sync --project agent python agent/scripts/qa_agent.py --mode full

  qa:agent:static:
    desc: Run secret-free static Agent QA for CI only
    cmds:
      - task: task:version:check
      - task: uv:version:check
      - task: agent:install
      - cmd: uv run --locked --no-sync --project agent python agent/scripts/qa_agent.py --mode static

  contracts:generate:python:
    desc: Generate Python bindings before installing the Agent package
    cmds:
      - uv run --no-project --python 3.12.13 python agent/src/scyg_agent/contract_generation.py generate

  contracts:generate:go:
    desc: Generate Go internal protobuf bindings from the root contracts
    cmds:
      - npx --yes @bufbuild/buf@1.47.2 generate contracts --template contracts/buf.gen.go.yaml --output backend/internal/generated/proto

  contracts:check:
    desc: Lint and check breaking changes against SCYG_CONTRACTS_ACCEPTED_BASE
    cmds:
      - uv run --no-project --python 3.12.13 python agent/scripts/contracts_gate.py

  agent:install:
    desc: Generate and install the real noneditable Agent distribution
    cmds:
      - task: contracts:generate:python
      - uv sync --locked --project agent --no-editable --reinstall-package scyg-agent

  agent:test:
    desc: Generate, install and test the installed Agent package
    cmds:
      - task: agent:install
      - uv run --locked --no-sync --project agent pytest

  agent:build:
    desc: Generate protobuf bindings before building wheel and sdist
    cmds:
      - task: contracts:generate:python
      - uv build --project agent
